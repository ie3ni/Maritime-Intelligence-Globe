[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maritime-intelligence-globe"
version = "0.1.0"
description = "Local-first historical maritime activity globe"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "fastapi>=0.115",
  "httpx>=0.27",
  "polars>=1.12",
  "pyarrow>=18",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "uvicorn[standard]>=0.32",
  "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]
imagery = ["Pillow>=11.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/maritime"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
